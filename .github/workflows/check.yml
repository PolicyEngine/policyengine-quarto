name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render (Quarto ${{ matrix.quarto }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The extensions declare quarto-required >=1.7.0; test that floor and
        # the current stable release.
        quarto: ["1.7.34", "1.10.19"]
    steps:
      - uses: actions/checkout@v7

      - name: Install XeLaTeX and image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern \
            libxml2-utils librsvg2-bin poppler-utils imagemagick

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.quarto }}

      - run: scripts/check.sh
