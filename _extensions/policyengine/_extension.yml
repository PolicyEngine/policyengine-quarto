title: PolicyEngine paper
author: PolicyEngine
version: 1.0.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    common:
      number-sections: true
      metadata-files:
        - theme-policyengine.yml
    pdf:
      pdf-engine: xelatex
      latex-auto-install: false
      geometry:
        - margin=1.1in
      format-resources:
        - fonts
      colorlinks: true
      # Source: policyengine-ui-kit/src/theme/tokens.css:51 (--border).
      code-block-border-left: "#E2E8F0"
      code-block-bg: false
      policyengine-font-dir: fonts
      template-partials:
        - partials/before-title.tex
        - partials/title.tex
        - partials/before-body.tex
    html:
      toc: true
      embed-resources: false
      code-block-bg: false
      theme:
        - default
        - policyengine.scss
      css: fonts.css
      template-partials:
        - partials/title-block.html
